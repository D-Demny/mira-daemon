device_name: "Mira"
device_type: "car_thing"
log_level: "info"

observer_mode: true

credentials:
  type: interactive

server:
  enabled: true
  address: "0.0.0.0"
  port: 3678
  allow_origin: "*"

report_url: ""

homeassistant:
  url: ""
  token: "" # injected by CI from repo secret HA_TOKEN; committed default intentionally empty (prior value leaked and was revoked 2026-09-18)

checkin: false
checkin_url: ""

# Raspberry Pi provisioning wizard (epic 10): the script the daemon execs
# when the settings UI triggers "Pi automatisch einrichten"
setup_pi:
  script_path: "/usr/local/share/mira/setup-pi.sh"

voice:
  enabled: false
  wake: false
