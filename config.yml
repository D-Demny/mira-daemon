device_name: "Mira"
device_type: "car_thing"
log_level: "debug"

observer_mode: true

credentials:
  type: interactive

server:
  enabled: true
  address: "0.0.0.0"
  port: 3678
  allow_origin: "*"

report_url: "https://mira-reports.mira-thing.workers.dev/"

homeassistant:
  url: "http://10.10.1.104:8123"
  token: "[REDACTED-ROTATED-HA-TOKEN]"

checkin: true
checkin_url: "https://mira-checkin.mira-thing.workers.dev"

# Raspberry Pi provisioning wizard (epic 10): the script the daemon execs
# when the settings UI triggers "Pi automatisch einrichten"
setup_pi:
  script_path: "/usr/local/share/mira/setup-pi.sh"

voice:
  enabled: false
  wake: false
